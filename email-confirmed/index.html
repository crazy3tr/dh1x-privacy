<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ggtkp</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root { --bg:#ffffff; --text:#1a1a1a; --sub:#5f6368; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --text:#ececec; --sub:#a0a4a8; } }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; box-sizing:border-box; text-align:center; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  img { width:96px; height:auto; margin-bottom:24px; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  p { margin:4px 0; color:var(--sub); }
  .en { margin-top:24px; }
</style>
</head>
<body>
  <img src="/logo.svg" alt="ggtkp">
  <h1>E-posta adresiniz doğrulandı ✓</h1>
  <p>Uygulamaya dönüp giriş yapabilirsiniz.</p>
  <div class="en">
    <h1>Your email is verified ✓</h1>
    <p>You can return to the app and sign in.</p>
  </div>
</body>
</html>
