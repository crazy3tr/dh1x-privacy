<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ggtkp</title>
<meta name="description" content="ggtkp">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root { --bg:#ffffff; --sub:#8a8f95; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --sub:#7d8288; } }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center;
    font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  img { width:min(40vw,160px); height:auto; }
  footer { position:fixed; bottom:16px; }
  footer a { color:var(--sub); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <img src="/logo.svg" alt="ggtkp">
  <footer><a href="/privacy-policy/">Gizlilik Politikası / Privacy Policy</a></footer>
</body>
</html>
